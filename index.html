<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE UNDERTIDE</title>
<style>
  html,body{margin:0;padding:0;background:#06110e;overflow:hidden;height:100%;font-family:Georgia,'Times New Roman',serif;}
  canvas{display:block;}
  #hud{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none;z-index:5;}
  #hungerwrap{width:180px;height:10px;border:1px solid #5a4a2a;background:#0a1512cc;border-radius:2px;overflow:hidden;}
  #hunger{height:100%;width:100%;background:linear-gradient(90deg,#8a5a20,#c8952f);transition:width .3s;}
  #prompt{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);color:#d8c690;font-size:15px;letter-spacing:.12em;text-shadow:0 1px 4px #000;pointer-events:none;z-index:5;}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(2,6,5,.85) 100%);}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:8;}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d8c690;z-index:9;pointer-events:none;text-align:center;}
  #msg h1{font-size:34px;letter-spacing:.35em;font-weight:normal;margin:0 0 12px;text-shadow:0 2px 10px #000;}
  #msg p{font-size:15px;letter-spacing:.12em;opacity:.85;margin:4px 0;}
  #msg .dim{opacity:.55;font-size:13px;}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hud"><div id="hungerwrap"><div id="hunger"></div></div></div>
<div id="prompt"></div>
<div id="fade"></div>
<div id="msg"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
